services:
  redis:
    image: redis:alpine
    ports: 
      - "6379:6379"
  db:
    image: postgres:15
    container_name: postgres_server
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: zoo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_ui
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
  fastapi-server:
    build: .
    env_file: .env
    volumes:
      - ./:/app/
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  postgres_data: